<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyTop</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div id="auth-screen" style="display:none;"></div>

  <div class="app-shell" style="display:none;">
    <button id="sidebar-toggle" class="sidebar-toggle" aria-label="פתיחת תפריט ניווט" aria-expanded="false" aria-controls="sidebar">
      <span aria-hidden="true">☰</span>
    </button>

    <nav id="sidebar" class="sidebar" aria-label="ניווט ראשי">
      <div class="sidebar-header">
        <span class="sidebar-logo" aria-hidden="true">📘</span>
        <span class="sidebar-title">StudyTop</span>
      </div>
      <ul id="sidebar-nav" class="sidebar-nav"></ul>
      <button id="logout-btn" class="btn btn-secondary" style="margin-top:auto;">🚪 התנתקות</button>
    </nav>

    <main id="main-content" class="main-content" tabindex="-1" aria-live="polite">
      <!-- הדף הנוכחי מוצג כאן ע"י router.js -->
    </main>
  </div>

  <div id="toast-container" class="toast-container" aria-live="assertive"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
